<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>五十音練習帳</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 10mm;
        }
        body {
            font-family: "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif;
            margin: 0;
            padding: 0;
            background: #fff;
        }
        h1 {
            text-align: center;
            color: #d86b85;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        .section {
            width: 48%;
        }
        .section-title {
            text-align: center;
            padding: 4px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .平假名 .section-title {
            background-color: #fce4ec;
            color: #c2185b;
        }
        .片假名 .section-title {
            background-color: #e3f2fd;
            color: #1976d2;
        }
        table {
            width: auto;
            margin: 0 auto;
            border-collapse: collapse;
            table-layout: fixed;
        }
        tr {
            height: 30px;
            /* 保險：即使某頁列數估算偏差，整列也會整個移到下一頁，絕不被切半 */
            break-inside: avoid;
            page-break-inside: avoid;
        }
        td {
            border: 1px solid #e0e0e0;
            text-align: center;
            vertical-align: middle;
            position: relative;
            box-sizing: border-box;
        }
        /* 練習格：寬高相等，保持方正 */
        td.grid-box {
            width: 56px;
            height: 56px;
        }
        .平假名 td { border-color: #f8bbd0; }
        .片假名 td { border-color: #bbdefb; }

        /* 假名提示欄。44px 是為了讓拗音（きゃ 兩個字元）也放得下：
           兩張表共 2×(44+5×56)+15gap = 663px，仍在 A4 去邊界後的 718px 內 */
        td.first-col {
            width: 44px;
            border-width: 2px;
            background-color: #fff;
        }
        .平假名 td.first-col { border-color: #f48fb1; }
        .片假名 td.first-col { border-color: #90caf9; }

        .kana {
            font-size: 16px;
            font-weight: bold;
            line-height: 1;
        }
        .romaji {
            font-size: 9px;
            color: #e91e63;
            display: block;
        }
        .片假名 .romaji { color: #1e88e5; }

        /* 米字線/虛線效果 */
        td.grid-box::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1px dashed #fad9e3;
            z-index: 1;
        }
        .片假名 td.grid-box::before {
            border-top-color: #d6e8fb;
        }
        td.grid-box::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            border-left: 1px dashed #fad9e3;
            z-index: 1;
        }
        .片假名 td.grid-box::after {
            border-left-color: #d6e8fb;
        }

        /* 分頁 */
        .page {
            page-break-after: always;
        }
        .page:last-child {
            page-break-after: auto;
        }
        /* 兩欄表格本身不允許被拆到跨頁 */
        .container, table {
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .page-label {
            text-align: center;
            color: #bbb;
            font-size: 11px;
            margin-top: 6px;
        }
        .screen-foot {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 16px;
        }
        .screen-foot a { color: #1976d2; text-decoration: none; }

        /* 音種選擇列：只在螢幕上出現，不會被印進練習帳 */
        .picker {
            max-width: 700px; margin: 16px auto 0; padding: 10px 14px;
            border: 1px solid #e0e0e0; border-radius: 10px;
            font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
            font-size: 13px; color: #555;
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        }
        .picker label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .picker .cnt { color: #999; margin-left: auto; }
        /* 列印時不顯示聯絡資訊與選擇列，避免出現在練習帳上 */
        @media print { .screen-foot, .picker { display: none; } }
    </style>
</head>
<body>

<div class="picker" id="picker"></div>
<div id="sheets"></div>

<script src="kana-data.js"></script>
<script>
    if (!window.KANA_DATA) {
        document.getElementById('sheets').innerHTML =
            '<p style="text-align:center;padding:40px;font-family:system-ui">' +
            '找不到 <b>kana-data.js</b>，本頁需要與該檔案放在同一個資料夾。</p>';
        throw new Error('kana-data.js not loaded');
    }
    const { KANA, ROWS, GROUPS } = window.KANA_DATA;

    // 每頁 16 列：16×56px 練習格 + 標題 ≈ 1000px，可完整裝進 A4（去邊界後約 1047px）。
    // 練習格縮到 56px 是為了讓 16 列仍塞得進單張紙，斷點不落在列中央而切掉格子。
    // 預設只印清音 46 音 → 16+16+14 恰好 3 頁；全部 104 音則是 7 頁。
    const PER_PAGE = 16;

    const rowGroup = new Map(ROWS.map(r => [r.id, r.g]));
    // 預設只勾清音，與互動練習的預設範圍一致
    const picked = new Set(['sei']);

    function buildTable(rows, script) {
        let html = '<table>';
        rows.forEach(item => {
            html += '<tr>';
            // 練習帳的假名就印在羅馬字旁邊，ぢ/づ 不會混淆，用主羅馬字即可
            html += `<td class="first-col"><span class="kana">${item[script]}</span>` +
                    `<span class="romaji">${item.r[0]}</span></td>`;
            for (let i = 0; i < 5; i++) html += '<td class="grid-box"></td>';
            html += '</tr>';
        });
        return html + '</table>';
    }

    function renderSheets() {
        const list = KANA.filter(k => picked.has(rowGroup.get(k.row)));
        const totalPages = Math.ceil(list.length / PER_PAGE);
        let html = '';
        for (let p = 0; p < totalPages; p++) {
            const slice = list.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
            html += '<div class="page">' +
                '<h1><a href="index.html" style="color:inherit;text-decoration:none">🌸 ひらがな・カタカナ 練習帳 🌸</a></h1>' +
                '<div class="container">' +
                    '<div class="section 平假名"><div class="section-title">ひらがな（平假名）</div>' + buildTable(slice, 'h') + '</div>' +
                    '<div class="section 片假名"><div class="section-title">カタカナ（片假名）</div>' + buildTable(slice, 'k') + '</div>' +
                '</div>' +
                `<div class="page-label">第 ${p + 1} / ${totalPages} 頁</div>` +
            '</div>';
        }
        document.getElementById('sheets').innerHTML = html ||
            '<p style="text-align:center;padding:40px;color:#999;font-family:system-ui">請至少勾選一種音。</p>';
        document.getElementById('picker-cnt').textContent = list.length + ' 音 · ' + totalPages + ' 頁';
    }

    function renderPicker() {
        const counts = {};
        for (const k of KANA) {
            const g = rowGroup.get(k.row);
            counts[g] = (counts[g] || 0) + 1;
        }
        document.getElementById('picker').innerHTML =
            '<span>要印的音：</span>' +
            GROUPS.map(g =>
                `<label><input type="checkbox" data-g="${g.id}"${picked.has(g.id) ? ' checked' : ''}>` +
                `${g.label} ${counts[g.id]}</label>`).join('') +
            '<span class="cnt" id="picker-cnt"></span>';
        document.querySelectorAll('#picker input').forEach(inp => inp.onchange = () => {
            inp.checked ? picked.add(inp.dataset.g) : picked.delete(inp.dataset.g);
            renderSheets();
        });
    }

    renderPicker();
    renderSheets();
</script>

<footer class="screen-foot">
    聯絡 / Contact： <a href="mailto:[email removed]">[email removed]</a>
    <br>
    © 2026 Alan Wang
</footer>

</body>
</html>
